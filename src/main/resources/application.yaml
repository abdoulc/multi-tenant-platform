server:
  port: 8080

spring:
  profiles:
    active: local
  application:
    name: platform

  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        default_schema: public
        #multiTenancy: SCHEMA

#logging:
 # level:
  #  org.hibernate.SQL: DEBUG
   # org.springframework.security: DEBUG

jwt:
  secret: ""
  expiration: 86400000